parameters:
  - $ref: "../params/order_uuid.yaml"

post:
  tags:
    - Order
  summary: Отменяет заказ
  operationId: CancelOrderByUuid
  responses:
    '204':
      description: Заказ успешно отменён.
    '404':
      description: Не найден заказ.
      content:
        application/json:
          schema:
            $ref: ../components/errors/not_found_error.yaml
    '409':
      description: Заказ уже оплачен и не может быть отменён.
      content:
        application/json:
          schema:
            $ref: "../components/errors/conflict_error.yaml"
    '500':
      description: Ошибка сервера
      content:
        application/json:
          schema:
            $ref: "../components/errors/internal_error.yaml"
    default:
      description: Непредвиденная ошибка
      content:
        application/json:
          schema:
            $ref: "../components/errors/generic_error.yaml"