type: object
required:
  - order_uuid
  - total_price
properties:
  order_uuid:
    type: string
    description: UUID заказа
    pattern: '^[0-9a-z]{8}-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{12}$'
    example: "123e4567-e89b-12d3-a456-426614174000"
  total_price:
    type: number
    format: double
    description: Стоимость всех деталей в заказе
    example: 123.45