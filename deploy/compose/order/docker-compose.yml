services:
  order-postgres:
    image: postgres:17.0-alpine3.20
    container_name: order-postgres
    environment:
      POSTGRES_DB: order-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - order-pgdata:/var/lib/postgresql/data
    restart:
      unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d order-db" ]
      interval: 10s # проверка с периодичностью 10 сек
      timeout: 5s # ожидание не более 5 сек
      retries: 5 # столько доступно неудачных попыток
    networks:
      - microservices-go-net

networks:
  microservices-go-net:
    external: true

volumes:
  order-pgdata: